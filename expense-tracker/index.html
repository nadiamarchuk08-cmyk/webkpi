<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Трекер витрат</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="js/app.js" defer></script> 
</head>
<body>
    <header>
        <h1>Трекер витрат</h1>
    </header>

    <div class="layout-container">
        <aside>
            <h2>Підсумковий баланс</h2>
            <p>Загальний баланс: 14350 грн</p>
            <span class="budget-status budget-status--good">Бюджет у нормі</span>
        </aside>
        <main>
            <section class="form">
                <h2>Додати операцію</h2>
                <form action="#" class="transaction-form">
                    <div class="form-group">
                        <label for="title">Опис операції:</label>
                        <input type="text" id="title" name="title">
                    </div>
                    <div class="form-group">
                        <label for="amount">Сума (грн):</label>
                        <input type="number" id="amount" name="amount">
                    </div>
                    <div class="form-group">
                        <label for="category">Категорія:</label>
                        <select id="category" name="category">
                            <option value="food">Їжа</option>
                            <option value="transport">Транспорт</option>
                            <option value="shopping">Покупки</option>
                            <option value="income">Дохід</option>
                            <option value="other">Інше</option>
                        </select>
                    </div>
                    <button type="submit">Додати</button>
                </form>
            </section>

            <section class="transactions">
                <h2>Операції</h2>
                <div class="cards">
                    <article class="card">
                        <img src="assets/food.png" alt="Категорія Їжа. Зображення столового приладдя" class="card_icon">
                        <div class="card-info">
                            <h3>Кафе</h3>
                            <span class="category-badge category-badge--food">Їжа</span>
                            <p class="date">Дата: <time datetime="2026-09-10">10 вересня 2026</time></p>
                        </div>
                        <p class="amount amount--expense">-400 грн</p>
                    </article>
                    <article class="card">
                        <img src="assets/shop.png" alt="Категорія Покупки. Зображення продуктової корзини" class="card_icon">
                        <div class="card-info">
                            <h3>Супермаркет</h3>
                            <span class="category-badge category-badge--shop">Покупки</span>
                            <p class="date">Дата: <time datetime="2026-09-11">11 вересня 2026</time></p>
                        </div>
                        <p class="amount amount--expense">-250 грн</p>
                    </article>
                    <article class="card">
                        <img src="assets/income.jpg" alt="Категорія Дохід. Зображення руки з грошима" class="card_icon">
                        <div class="card-info">
                            <h3>Зарплата</h3>
                            <span class="category-badge category-badge--income">Дохід</span>
                            <p class="date">Дата: <time datetime="2026-08-27">27 серпня 2026</time></p>
                        </div>
                        <p class="amount amount--income">+15000 грн</p>
                    </article>
                </div>
            </section>
        </main>
    </div>

    <footer>
        <p>&copy; 2026 Трекер витрат. Автор: Марчук Надія</p>
    </footer>
</body>
</html>
